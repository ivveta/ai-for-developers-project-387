# E2E-окружение: PostgreSQL + бэкенд с тестовой БД.
# Запуск: docker compose -f docker-compose.e2e.yml up -d --build --wait
# Остановка: docker compose -f docker-compose.e2e.yml down -v
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: e2e/Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://calendar:calendar@postgres:5432/calendar_test
      TEST_DATABASE_URL: postgres://calendar:calendar@postgres:5432/calendar_test
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/event-types').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      postgres:
        condition: service_healthy
