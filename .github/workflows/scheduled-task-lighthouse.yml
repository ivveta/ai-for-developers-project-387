name: scheduled-task-lighthouse

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
      - name: Open issue on budget failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = '.lighthouseci';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json') && f.startsWith('lhr-'));
            if (!files.length) {
              core.warning('No LHR JSON files found');
              return;
            }
            const metrics = [];
            for (const file of files) {
              const lhr = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
              const url = lhr.finalUrl || lhr.requestedUrl;
              const cats = lhr.categories || {};
              metrics.push({
                url,
                performance: Math.round((cats.performance?.score ?? 0) * 100),
                accessibility: Math.round((cats.accessibility?.score ?? 0) * 100),
                bestPractices: Math.round((cats['best-practices']?.score ?? 0) * 100),
                seo: Math.round((cats.seo?.score ?? 0) * 100),
              });
            }
            let body = '## Lighthouse budget failure\n\n';
            body += '| URL | Performance | Accessibility | Best Practices | SEO |\n';
            body += '|-----|-------------|---------------|----------------|-----|\n';
            for (const m of metrics) {
              body += `| ${m.url} | ${m.performance} | ${m.accessibility} | ${m.bestPractices} | ${m.seo} |\n`;
            }
            body += '\nReview thresholds in `lighthouserc.json` and fix regressions.';
            const title = 'Lighthouse: budget failure detected';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'lighthouse',
              per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['lighthouse'],
              });
            }
