name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencode:
    if: |
      github.event.comment.user.login == 'ivveta' &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      actions: read
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check daily agent budget
        env:
          MAX_RUNS_PER_DAY: '10'
        uses: actions/github-script@v7
        with:
          script: |
            const max = Number(process.env.MAX_RUNS_PER_DAY);
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'opencode.yml',
              created: `>=${since}`,
              per_page: 100,
            });
            const count = data.workflow_runs.filter(
              (r) => r.status === 'completed' && r.conclusion === 'success' && r.run_id !== context.runId
            ).length;
            core.info(`Agent runs in last 24h: ${count}/${max}`);
            if (count >= max) core.setFailed(`Daily agent budget exceeded: ${count} >= ${max}`)

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"*": "allow"}'
        with:
          model: opencode/big-pickle
          prompt: |
            Все коммиты ДОЛЖНЫ быть по Conventional Commits (feat:, fix:, chore:, и т.д.).
            Формат: type: описание на русском языке. Без точки в конце.
            Примеры: fix: исправить валидацию выходных дней, feat: добавить страницу ошибки.

            ВАЖНО: После завершения работы сделай ОДИН итоговый git-коммит со всеми
            изменениями (git add . && git commit). Не оставляй uncommitted файлы —
            иначе GitHub Action автоматически создаст коммит без Conventional Commits
            формата и pipeline упадёт.