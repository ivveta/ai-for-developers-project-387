# PostgreSQL 16 для разработки (порт 5432) и отдельная тестовая БД (порт 5433)
# для интеграционных тестов. Значения пользователя/пароля/имён БД соответствуют
# DATABASE_URL и TEST_DATABASE_URL из .env.example.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
